<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>自习室</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page" style="padding-bottom: 160px;">
    <div class="topbar">
      <button class="topbar__back" id="back" type="button">‹</button>
      <div class="topbar__title" id="navTitle">自习室</div>
    </div>

    <div class="room-card" id="roomCard" hidden>
      <div class="room-head">
        <div class="room-name" id="roomName"></div>
        <div class="tag locked" id="roomLocked" hidden>有密码</div>
      </div>
      <div class="room-sub">
        <span id="memberCount">0</span> 位成员
        <span class="link" id="toggleMembers">查看成员</span>
      </div>
      <div class="members" id="members" hidden></div>
      <div class="room-actions">
        <button class="mini-btn" id="invite" type="button">邀请同学</button>
        <button class="mini-btn" id="copyId" type="button">复制房间号</button>
        <button class="mini-btn danger" id="deleteRoom" type="button" hidden>解散房间</button>
        <button class="mini-btn" id="leaveRoom" type="button" hidden>退出房间</button>
      </div>
    </div>

    <div class="section-title">房间交流</div>
    <div class="list" id="list"></div>
    <div class="tip" id="tip">加载中...</div>

    <div class="footer">
      <div class="reply-bar" id="replyBar" hidden>
        <span>回复 @<span id="replyName"></span></span>
        <span class="reply-cancel" id="cancelReply">取消</span>
      </div>
      <input class="nickname-input" id="nickname" placeholder="昵称（可留空，默认匿名）" maxlength="20" />
      <div class="input-row">
        <textarea class="content-input" id="content" placeholder="和大家说点什么..." maxlength="500"></textarea>
        <button class="submit-btn" id="submit" type="button">发送</button>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script src="room.js"></script>
</body>
</html>
