<!DOCTYPE html>
<html lang="zh-CN" data-theme="green">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>青番 · AI 番茄钟</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidenav">
      <div class="sidenav__brand">
        <span class="sidenav__mark">🍅</span>
        <div>
          <div class="sidenav__name">青番</div>
          <div class="sidenav__en">QINGFAN · WEB</div>
        </div>
      </div>
      <nav class="sidenav__nav">
        <div class="sidenav__item" data-route="today"><span class="ic">🌿</span>今日</div>
        <div class="sidenav__item" data-route="studyroom"><span class="ic">🏫</span>自习室</div>
        <div class="sidenav__item" data-route="timeline"><span class="ic">🕒</span>时间轴</div>
        <div class="sidenav__item" data-route="data"><span class="ic">📊</span>数据</div>
        <div class="sidenav__item" data-route="me"><span class="ic">🙂</span>我的</div>
      </nav>
      <div class="sidenav__theme">
        <div class="sidenav__theme-label">外观主题</div>
        <div class="sidenav__dots" id="themeDots">
          <span data-th="green" title="青番绿"></span>
          <span data-th="dark" title="深夜墨"></span>
          <span data-th="dawn" title="晨光暖"></span>
          <span data-th="ocean" title="静谧蓝"></span>
        </div>
      </div>
      <div class="sidenav__spacer"></div>
      <button class="sidenav__login" id="userChip" type="button">登录 / 注册</button>
    </aside>

    <main class="main">
      <div class="main__inner" id="view"></div>
    </main>
  </div>

  <nav class="tabbar">
    <div class="tabbar__item" data-route="today"><span class="ic">🌿</span>今日</div>
    <div class="tabbar__item" data-route="studyroom"><span class="ic">🏫</span>自习室</div>
    <div class="tabbar__item" data-route="timeline"><span class="ic">🕒</span>时间轴</div>
    <div class="tabbar__item" data-route="data"><span class="ic">📊</span>数据</div>
    <div class="tabbar__item" data-route="me"><span class="ic">🙂</span>我的</div>
  </nav>

  <div id="modalRoot"></div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
