<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>自习室</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <!-- 顶栏 -->
    <div class="sr-head">
      <div class="sr-head__txt">
        <div class="sr-head__title">自习室</div>
        <div class="sr-head__sub">和好友一起，专注不孤单</div>
      </div>
      <div class="sr-head__actions">
        <button class="pill pill--ghost" id="userBtn" type="button">登录</button>
        <button class="pill pill--ghost" id="joinRoom" type="button">加入</button>
        <button class="pill pill--leaf" id="createRoom" type="button">＋ 创建</button>
      </div>
    </div>

    <!-- 我的自习室 -->
    <div id="mineWrap"></div>

    <!-- 自习动态 -->
    <div class="section-title">自习动态</div>
    <div class="feed" id="feed"></div>

    <!-- 留言板 -->
    <div class="section-title">留言板</div>
    <div class="board">
      <div class="board__row">
        <select class="board__room" id="boardRoom"></select>
        <input class="board__input" id="boardInput" placeholder="写一句留言…" maxlength="500" />
        <button class="board__send" id="boardSend" type="button">发送</button>
      </div>
      <div class="board__list" id="boardList"></div>
    </div>

    <!-- 好友的自习室 -->
    <div class="section-title" id="otherTitle" hidden>好友的自习室</div>
    <div class="rooms" id="otherRooms"></div>

    <div class="empty" id="empty" hidden>还没有自习室，点右上角「＋ 创建」开始吧</div>
    <div class="empty" id="loading">加载中...</div>
  </main>

  <!-- 创建弹窗 -->
  <div class="modal" id="createModal" hidden>
    <div class="modal__mask" data-close></div>
    <div class="modal__panel">
      <div class="modal__title">创建自习室</div>
      <div class="modal__hint">起个名字，选个主题，喊上好友一起学</div>
      <input class="modal__input" id="newName" placeholder="自习室名称" maxlength="60" />
      <div class="theme-row" id="themeRow">
        <button class="theme-chip is-on" data-theme="共学" type="button">📚<span>共学</span></button>
        <button class="theme-chip" data-theme="晨读" type="button">🌅<span>晨读</span></button>
        <button class="theme-chip" data-theme="冲刺" type="button">🔥<span>冲刺</span></button>
        <button class="theme-chip" data-theme="静心" type="button">🌙<span>静心</span></button>
      </div>
      <div class="modal__actions">
        <button class="modal__btn" data-close type="button">取消</button>
        <button class="modal__btn modal__btn--primary" id="doCreate" type="button">创建</button>
      </div>
    </div>
  </div>

  <!-- 确认弹窗（解散 / 退出） -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal__mask" data-close></div>
    <div class="modal__panel">
      <div class="modal__title" id="cfmTitle">删除自习室？</div>
      <div class="modal__hint" id="cfmText"></div>
      <div class="modal__actions">
        <button class="modal__btn" data-close type="button">取消</button>
        <button class="modal__btn modal__btn--danger" id="cfmOk" type="button">删除</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script src="home.js"></script>
</body>
</html>
